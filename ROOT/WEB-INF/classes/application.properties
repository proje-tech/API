spring.application.name=admin-api
server.port=8085

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=qintech_db;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username= sa
spring.datasource.password= 1234
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.file.path=/
logging.file.name=logs.txt
logging.level.root=INFO
logging.level.org.hibernate=ERROR

#admin ui
admin.ui.ip=0:0:0:0:0:0:0:1