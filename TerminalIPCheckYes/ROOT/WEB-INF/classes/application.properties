spring.application.name=qintech-api

# Segment Service
remote.server.url=https://testapi.io/api/Goballer/request-ticket
remote.server.timeout=5000

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=qintech_db;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username= sa
spring.datasource.password= 1234
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework=TRACE
#logging.level.com.allintech=TRACE
#logging.level.root=DEBUG

#logging
logging.file.path=/
logging.file.name=qintech-api-logs.txt
logging.level.root=INFO
logging.level.org.hibernate=ERROR

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000

#kiosk ui
kiosk.ui.ip=0:0:0:0:0:0:0:1

#kiosk health check schedule (cron expression)
kiosk.health.check.cron=0 0 8,12,19 * * ?

# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html